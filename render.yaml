services:
  - type: web
    name: vetcare-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/app/data/vetcare.db
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: SEED_ON_START
        value: "true"
    disk:
      name: vetcare-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: vetcare-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # Render no soporta pasar build args por Blueprint (no existe un campo
    # para esto en el render.yaml spec); por eso la URL del backend en
    # producción queda como valor por defecto del ARG en frontend/Dockerfile.
    # docker-compose.yml (uso local) sigue pasando su propio build arg y no
    # se ve afectado por este valor por defecto.
