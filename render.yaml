services:
  - type: web
    name: vetcare-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/app/data/vetcare.db
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: SEED_ON_START
        value: "true"
    disk:
      name: vetcare-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: vetcare-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    dockerBuildArgs:
      VITE_API_URL: https://vetcare-backend.onrender.com/api
