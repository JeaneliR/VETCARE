name: CI Integración Continua

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend:
    name: Backend - pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Ejecutar pruebas unitarias
        working-directory: backend
        run: npm run test:ci

      - name: Generar cliente de Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Compilar
        working-directory: backend
        run: npm run build

  integration-and-security:
    name: Backend - pruebas de integración y seguridad (PostgreSQL real)
    runs-on: ubuntu-latest

    # Postgres real como servicio del job, con healthcheck: las pruebas de
    # integración/seguridad necesitan una base de datos de verdad (login,
    # crear registros, validar que una inyección SQL no rompa la tabla,
    # etc.), no solo compilar o correr pruebas unitarias.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vetcare_test
          POSTGRES_USER: vetcare
          POSTGRES_PASSWORD: vetcare-local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vetcare -d vetcare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vetcare:vetcare-local@localhost:5432/vetcare_test
      JWT_SECRET: vetcare-test-secret-no-usar-en-produccion
      JWT_EXPIRES_IN: 12h
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Aplicar migraciones sobre la base de prueba
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Cargar datos de prueba (seed)
        working-directory: backend
        run: npm run seed

      - name: Ejecutar pruebas de integración
        working-directory: backend
        run: npm run test:integration

      - name: Ejecutar pruebas de seguridad
        working-directory: backend
        run: npm run test:security

  frontend:
    name: Frontend - compilación
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar
        working-directory: frontend
        run: npm run build
